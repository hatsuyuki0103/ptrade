[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptrade"
version = "1.2.0"
description = "A 股 CANSLIM 模拟盘：T+1 / 融资融券 / 风控 / 七因子打分 / K 线图"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "akshare>=1.19",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ptrade = "ptrade.cli:main"

[project.urls]
Homepage = "https://github.com/hatsuyuki0103/ptrade"
Repository = "https://github.com/hatsuyuki0103/ptrade"
Issues = "https://github.com/hatsuyuki0103/ptrade/issues"

[tool.setuptools]
packages = ["ptrade"]

# `vendor/echarts.min.js` 是 chart 子命令的运行时必需资源：不显式声明的话
# setuptools 只打包 *.py，装出来的 wheel 会在渲染图表时报「缺少 vendored ECharts」。
[tool.setuptools.package-data]
ptrade = ["vendor/*.js", "vendor/*.min.js", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

