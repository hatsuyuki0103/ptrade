name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 夹具不入 git（约 6.6 MB / 90 个 JSON）。优先从 release 拉；
      # 没有就现拉重建（需要 akshare 联网，慢但不阻塞）。
      - name: Fetch offline fixtures
        run: |
          python tools/fetch-fixtures.py --no-fallback || {
            echo "::warning::release 里没有夹具 asset，回退到 build_fixtures.py 现拉重建"
            python tools/build_fixtures.py
          }
          echo "fixture 文件数: $(ls data/fixture/*.json 2>/dev/null | wc -l)"

      - name: Test
        env:
          PYTHONUTF8: '1'
        run: python -m pytest tests -q

      - name: Scenario self-check
        env:
          PYTHONUTF8: '1'
        run: python tools/build_scenario.py --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build
      - name: Verify wheel bundles the vendored ECharts
        # chart 子命令依赖 vendor/echarts.min.js；package-data 没配好时
        # wheel 会小一个数量级而测试仍然全绿（测试跑的是源码树）。这里直接查 wheel 内容。
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob('dist/*.whl'))[-1]
          names = zipfile.ZipFile(whl).namelist()
          target = [n for n in names if n.endswith('vendor/echarts.min.js')]
          size = zipfile.ZipFile(whl).getinfo(target[0]).file_size if target else 0
          print(f'{whl}: {len(names)} entries, echarts={size:,} B')
          if not target or size < 500_000:
              sys.exit('vendor/echarts.min.js 未打进 wheel —— chart 子命令会失效')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
